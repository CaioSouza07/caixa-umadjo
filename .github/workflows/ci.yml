name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API (build + testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Compilar, testar e empacotar
        run: mvn -B verify

      - name: Anexar relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: ignore

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  scripts:
    name: Scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck --exclude=SC1091 scripts/*.sh

  smoke:
    name: Smoke test (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Criar .env de CI
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^DATASOURCE_USERNAME=.*|DATASOURCE_USERNAME=ci|' \
            -e 's|^DATASOURCE_PASSWORD=.*|DATASOURCE_PASSWORD=ci-password|' \
            -e "s|^SECURITY_TOKEN_JWT_API=.*|SECURITY_TOKEN_JWT_API=$(openssl rand -hex 32)|" \
            .env
          if grep -E '^[A-Z_]+=$' .env; then
            echo "Variáveis sem valor no .env de CI (faltou atualizar o .env.example ou este step)." >&2
            exit 1
          fi

      - name: Validar docker compose
        run: |
          docker compose -f infra/docker-compose.yml -f infra/docker-compose.app.yml \
            --env-file .env config --quiet

      - name: Subir banco, API e front
        run: ./scripts/up.sh

      - name: API responde UP
        run: curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'

      - name: Front responde
        run: curl -fsS -o /dev/null http://localhost:3000

      - name: Logs dos containers
        if: failure()
        run: |
          source scripts/_common.sh
          compose ps --all
          compose logs --no-color
