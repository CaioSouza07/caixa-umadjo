spring:
  application:
    name: api

  config:
    import:
      - optional:file:../../.env[.properties]

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

  flyway:
    enabled: true

api:
  security:
    token: 
      jwt: ${SECURITY_TOKEN_JWT_API}
      create-user: ${SECURITY_TOKEN_CREATE_USER_API}
    cors:
      origins: ${SECURITY_CORS_ORIGINS}